name: Seguridad

# Escaneo de secretos (Gitleaks) y analisis estatico (Semgrep) en cada push y PR a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          semgrep scan
          --config p/terraform
          --config p/secrets
          --severity ERROR
          --error
          --metrics=off
          --exclude node_modules --exclude .terraform
